    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Synchronize HTML light-mode state to body
        if (document.documentElement.classList.contains('light-mode')) {
          document.body.classList.add('light-mode');
        }

        // Create and inject floating theme toggle button immediately
        const themeToggle = document.createElement('button');
        themeToggle.id = 'theme-toggle-btn';
        
        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'light') {
          document.body.classList.add('light-mode');
          document.documentElement.classList.add('light-mode');
          themeToggle.innerHTML = '🌙';
        } else {
          themeToggle.innerHTML = '☀️';
        }
        
        themeToggle.addEventListener('click', () => {
          const isLight = document.body.classList.toggle('light-mode');
          if (isLight) {
            document.documentElement.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
            themeToggle.innerHTML = '🌙';
            if (window.showSyncToast) window.showSyncToast("Light Mode Enabled!");
          } else {
            document.documentElement.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
            themeToggle.innerHTML = '☀️';
            if (window.showSyncToast) window.showSyncToast("Dark Mode Enabled!");
          }
        });
        
        document.body.appendChild(themeToggle);

        const interval = setInterval(() => {
          const aside = document.querySelector('aside');
          const main = document.querySelector('main');
          if (aside && main) {
            clearInterval(interval);
            
            // Create hamburger button (standard 3-line menu)
            const hamburger = document.createElement('button');
            hamburger.id = 'mobile-hamburger';
            hamburger.innerHTML = '☰'; // 3 lines!
            document.body.appendChild(hamburger);
            
            // Create backdrop overlay
            const overlay = document.createElement('div');
            overlay.id = 'sidebar-overlay';
            document.body.appendChild(overlay);
            
            const flexWrapper = aside.parentElement;
            
            const toggleSidebar = () => {
              flexWrapper.classList.toggle('sidebar-open');
              overlay.classList.toggle('active');
              hamburger.classList.toggle('active');
              if (hamburger.classList.contains('active')) {
                hamburger.innerHTML = '✕'; // Cross close icon
              } else {
                hamburger.innerHTML = '☰'; // 3-line hamburger menu
              }
            };
            
            hamburger.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);
            
            // Close sidebar automatically on navigation/state click
            aside.addEventListener('click', (e) => {
              if (e.target.closest('nav > div') || e.target.closest('.slide-toggle-item') || e.target.closest('button')) {
                if (flexWrapper.classList.contains('sidebar-open')) {
                  toggleSidebar();
                }
              }
            });
          }
        }, 100);
      });
    </script>

    <script>
      // Global window.alert override for premium glassmorphism overlays
      window.alert = function(msg) {
        const overlay = document.getElementById('custom-alert-overlay');
        const msgEl = document.getElementById('custom-alert-message');
        const closeBtn = document.getElementById('custom-alert-close');
        if (overlay && msgEl && closeBtn) {
          msgEl.innerHTML = msg.replace(/\n/g, '<br>');
          overlay.style.display = 'flex';
          const closeAlert = () => {
            overlay.style.display = 'none';
            closeBtn.removeEventListener('click', closeAlert);
          };
          closeBtn.addEventListener('click', closeAlert);
        } else {
          console.log("Alert:", msg);
        }
      };

            list.style.cssText = 'display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto; margin:8px 0;';
            
            if (playlists.length === 0) {
              const empty = document.createElement('span');
              empty.style.cssText = 'font-size:12px; color:rgba(255,255,255,0.4); text-align:center; font-style:italic; padding:10px 0;';
              empty.innerText = 'No playlists found. Create one below!';
              list.appendChild(empty);
            } else {
              playlists.forEach(pl => {
                const item = document.createElement('div');
                item.style.cssText = 'padding:10px 14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:8px; color:white; font-size:13px; font-weight:600; text-align:left; cursor:pointer; transition:all 0.2s ease;';
                item.innerText = pl.name;
                item.addEventListener('mouseover', () => {
                  item.style.background = 'rgba(16, 185, 129, 0.1)';
                  item.style.borderColor = 'rgba(16, 185, 129, 0.3)';
                });
                item.addEventListener('mouseout', () => {
                  item.style.background = 'rgba(255,255,255,0.04)';
                  item.style.borderColor = 'rgba(255,255,255,0.06)';
                });
                item.addEventListener('click', () => {
                  fetch('api/playlist.php?action=addTrack', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                      playlistId: pl.id,
                      videoId: track.id,
                      title: track.title,
                      artist: track.artist,
                      thumbnail: track.thumbnail,
                      duration: track.duration
                    })
                  })
                  .then(r => r.json())
                  .then(resData => {
                    if (resData.error) {
                      alert(resData.error);
                    } else {
                      if (window.showSyncToast) {
                        window.showSyncToast(`Saved to "${pl.name}"!`);
                      }
                      closeModal();
                    }
                  });
                });
                list.appendChild(item);
              });
            }
            
            const newBtn = document.createElement('button');
            newBtn.style.cssText = 'padding:10px; border-radius:8px; border:none; font-weight:700; cursor:pointer; font-size:12px; background:linear-gradient(135deg, #10b981, #00ff87); color:white;';
            newBtn.innerText = '➕ Create New Playlist';
            
            newBtn.addEventListener('click', () => {
              const name = prompt("Enter new playlist name:");
              if (name && name.trim()) {
                fetch('api/playlist.php?action=create', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                  },
                  body: JSON.stringify({ name: name.trim() })
                })
                .then(r => r.json())
                .then(resData => {
                  if (resData.error) {
                    alert(resData.error);
                  } else {
                    closeModal();
                    window.saveTrackToPlaylist(track);
                  }
                });
              }
            });
            
            const cancelBtn = document.createElement('button');
            cancelBtn.style.cssText = 'padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.6); font-weight:600; cursor:pointer; font-size:12px;';
            cancelBtn.innerText = 'Cancel';
            
            const closeModal = () => {
              backdrop.style.opacity = '0';
              modal.style.transform = 'scale(0.9)';
              setTimeout(() => backdrop.remove(), 300);
            };
            cancelBtn.addEventListener('click', closeModal);
            backdrop.addEventListener('click', closeModal);
            modal.addEventListener('click', e => e.stopPropagation());
            
            modal.appendChild(title);
            modal.appendChild(trackDetails);
            modal.appendChild(list);
            modal.appendChild(newBtn);
            modal.appendChild(cancelBtn);
            
            backdrop.appendChild(modal);
            document.body.appendChild(backdrop);
            
            requestAnimationFrame(() => {
              backdrop.style.opacity = '1';
              modal.style.transform = 'scale(1)';
            });
          })
          .catch(err => console.error("Error saving track to playlist:", err));
        };




        // Wait for page load
        window.addEventListener('load', () => {
          // Fetch current version from server API safely
          fetch('api/version.php')
            .then(res => res.text())
            .then(text => {
              let data;
              try {
                data = JSON.parse(text);
              } catch (e) {
                // Raw PHP fallback when served via static node server
                data = { version: window.SYNC_TUNE_VERSION || '2.9.14', maintenance: false };
              }

              if (data.maintenance === true) {
                let isAdmin = false;
                try {
                  const rawUser = localStorage.getItem('user');
                  if (rawUser) {
                    const u = JSON.parse(rawUser);
                    if (u.role === 'admin') {
                      isAdmin = true;
                    }
                  }
                } catch (e) {}
                
                if (!isAdmin) {
                  renderMaintenancePage();
                  return;
                }
              }
              const serverVersion = data.version || '2.9.14';
              const serverFeatures = data.features;
              const localVersion = window.SYNC_TUNE_VERSION || '2.9.14';

              if (isVersionGreater(serverVersion, localVersion)) {
                // Perform aggressive cache purge and auto-update
                if ('caches' in window) {
                  caches.keys().then(names => names.forEach(name => caches.delete(name))).catch(() => {});
                }
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(() => {});
                }

                const hasReloaded = sessionStorage.getItem('synctune_has_reloaded');
                if (hasReloaded !== 'true') {
                  sessionStorage.setItem('synctune_has_reloaded', 'true');
                  console.log("New version detected! Reloading to update...");
                  window.location.reload(true);
                } else {
                  console.warn("New version detected! Hard-bypassing browser cache...");
                  sessionStorage.removeItem('synctune_has_reloaded');
                  const cleanUrl = window.location.origin + window.location.pathname + '?v=' + encodeURIComponent(serverVersion) + '&_t=' + Date.now();
                  window.location.replace(cleanUrl);
                }
              } else {
                // Version matches!
                sessionStorage.removeItem('synctune_has_reloaded');
                localStorage.setItem('synctune_last_seen_version', localVersion);
              }
            })
            .catch(err => console.error("Error running auto-update check:", err));
        });

        // Helper: SemVer comparison (returns true if v1 > v2)
        function isVersionGreater(v1, v2) {
          const parts1 = v1.split('.').map(Number);
          const parts2 = v2.split('.').map(Number);
          for (let i = 0; i < 3; i++) {
            const p1 = parts1[i] || 0;
            const p2 = parts2[i] || 0;
            if (p1 > p2) return true;
            if (p1 < p2) return false;
          }
          return false;
        }

        // Cache warning banner removed

        // Helper: Render gorgeous cinematic maintenance page
        function renderMaintenancePage() {
          document.body.innerHTML = `
            <div style="background-color:#040806; color:#e2e8f0; font-family:'Roboto', sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; width:100vw; overflow:hidden; box-sizing:border-box;">
              <div style="width:90%; max-width:480px; padding:40px 32px; background:rgba(11,18,15,0.5); border:1px solid rgba(255,255,255,0.08); border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,0.6); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); text-align:center; box-sizing:border-box; animation: fadeIn 0.5s ease;">
                <div style="font-size:56px; margin-bottom:24px; animation: bounce 2s infinite; display:inline-block;">🛠️</div>
                <h1 style="font-family:'Outfit', sans-serif; font-size:24px; font-weight:800; color:white; margin:0 0 12px 0; background:linear-gradient(135deg, #10b981, #00ff87); -webkit-background-clip:text; -webkit-text-fillColor:transparent;">Upgrades in Progress</h1>
                <p style="font-size:14px; color:#94a3b8; line-height:1.6; margin:0 0 32px 0;">
                  We are currently performing scheduled backend optimizations to keep your listening rooms perfectly synced and secure. 
                  <br><br>
                  SyncTune will be back online shortly with enhanced performance! Thank you for your patience.
                </p>
                <div style="border-top:1px solid rgba(255,255,255,0.06); padding-top:20px; font-size:11px; color:#64748b; letter-spacing:0.5px; text-transform:uppercase; font-weight:700;">
                  ⚡ SyncTune Secure Streaming Layer
                </div>
              </div>
            </div>
          `;
        }
      })();
    </script>
    
    <!-- Native Mobile Background Playback Script -->
    <script>
      (function() {
        let lastTitle = "";
        let lastArtist = "";
        let lastThumb = "";
        let silentAudio = null;

        // Initialize silent audio element
        function initSilentAudio() {
          if (!silentAudio) {
            silentAudio = document.createElement('audio');
            silentAudio.id = 'synctune-bg-keepalive';
            silentAudio.src = 'data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAAABmYWN0BAAAAAAAAABkYXRhAAAAAA==';
            silentAudio.loop = true;
            silentAudio.style.display = 'none';
            document.body.appendChild(silentAudio);
          }
        }

        // Register Media Session controls
        function setupMediaSession() {
          if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => {
              if (window.ytPlayerInstance && typeof window.ytPlayerInstance.playVideo === 'function') {
                window.ytPlayerInstance.playVideo();
              }
              if (silentAudio) {
                silentAudio.play().catch(() => {});
              }
              navigator.mediaSession.playbackState = 'playing';
            });

            navigator.mediaSession.setActionHandler('pause', () => {
              if (window.ytPlayerInstance && typeof window.ytPlayerInstance.pauseVideo === 'function') {
                window.ytPlayerInstance.pauseVideo();
              }
              if (silentAudio) {
                silentAudio.pause();
              }
              navigator.mediaSession.playbackState = 'paused';
            });

            navigator.mediaSession.setActionHandler('previoustrack', () => {
              const prevBtn = document.querySelector('button[title*="Previous track"]');
              if (prevBtn) prevBtn.click();
            });

            navigator.mediaSession.setActionHandler('nexttrack', () => {
              const nextBtn = document.querySelector('button[title*="Next track"]');
              if (nextBtn) nextBtn.click();
            });
          }
        }

        // Monitor player and update lock screen details
        setInterval(() => {
          try {
            // Find metadata DOM elements
            // Cover Image
            const imgEl = document.querySelector('footer img.spinning-cover') || document.querySelector('footer img');
            // Title
            const titleEl = document.querySelector('footer div[style*="songTitle"]') || document.querySelector('footer .songTitle');
            // Artist
            const artistEl = document.querySelector('footer div[style*="songArtist"]') || document.querySelector('footer .songArtist');

            if (titleEl && artistEl) {
              const title = titleEl.innerText || titleEl.textContent;
              const artist = artistEl.innerText || artistEl.textContent;
              const thumb = imgEl ? imgEl.src : '';

              if (title && title !== "No song playing" && (title !== lastTitle || artist !== lastArtist)) {
                lastTitle = title;
                lastArtist = artist;
                lastThumb = thumb;

                initSilentAudio();
                setupMediaSession();

                if ('mediaSession' in navigator) {
                  navigator.mediaSession.metadata = new MediaMetadata({
                    title: title,
                    artist: artist,
                    album: 'SyncTune',
                    artwork: [
                      { src: thumb || 'favicon.svg', sizes: '256x256', type: 'image/png' }
                    ]
                  });
                }
              }
            }

            // Sync audio keepalive state based on actual player status
            if (window.ytPlayerInstance && typeof window.ytPlayerInstance.getPlayerState === 'function') {
              const state = window.ytPlayerInstance.getPlayerState();
              if (state === 1) { // Playing
                initSilentAudio();
                if (silentAudio && silentAudio.paused) {
                  silentAudio.play().catch(() => {});
                }
                if ('mediaSession' in navigator) {
                  navigator.mediaSession.playbackState = 'playing';
                }
              } else if (state === 2 || state === 0 || state === -1) { // Paused / Ended / Unstarted
                if (silentAudio && !silentAudio.paused) {
                  silentAudio.pause();
                }
                if ('mediaSession' in navigator) {
                  navigator.mediaSession.playbackState = 'paused';
                }
              }
            }
          } catch(err) {
            // Silently capture errors
          }
        }, 1000);
      })();
    </script>
