<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SyncTune Cinema Mini Player</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('videoId');
    const startVolume = parseFloat(urlParams.get('volume') || '0.8');

    // Load YouTube Iframe API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    let player;
    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('player', {
        host: 'https://www.youtube-nocookie.com',
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          controls: 1,
          disablekb: 0,
          fs: 1,
          rel: 0,
          showinfo: 0,
          modestbranding: 1,
          origin: window.location.origin
        },
        events: {
          onReady: (event) => {
            event.target.setVolume(startVolume * 100);
            // Notify parent window that we are ready
            if (window.opener) {
              window.opener.postMessage({ type: 'pip_ready' }, '*');
            }
          },
          onStateChange: (event) => {
            if (window.opener) {
              // Sync play/pause state back to parent
              const isPlaying = (event.data === YT.PlayerState.PLAYING);
              window.opener.postMessage({
                type: 'pip_state_change',
                isPlaying: isPlaying,
                time: player.getCurrentTime()
              }, '*');
            }
          }
        }
      });
    };

    // Listen for sync events from the parent window
    window.addEventListener('message', (event) => {
      if (!player || typeof player.getPlayerState !== 'function') return;
      
      const data = event.data;
      if (data.type === 'parent_sync') {
        const time = data.time;
        const isPlaying = data.isPlaying;
        
        if (isPlaying) {
          player.playVideo();
        } else {
          player.pauseVideo();
        }
        
        if (Math.abs(player.getCurrentTime() - time) > 2) {
          player.seekTo(time, true);
        }
      } else if (data.type === 'parent_volume') {
        player.setVolume(data.volume * 100);
      }
    });
  </script>
</body>
</html>
